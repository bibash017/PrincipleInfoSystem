<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In / Sign Up | FoodBridge</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-layout">

    <!-- LEFT: green brand panel -->
    <section class="brand-panel">
      <a href="index.html" class="brand-logo">
        <img src="images/Food Bridge-logo.png" alt="FoodBridge logo">
        FoodBridge
      </a>
      <img src="images/signup.png" alt="Donated food packed on a table" class="brand-image">
      <h2>Every listing is a meal saved.</h2>
      <p>Join local organizations already rescuing food in Winnipeg.</p>
    </section>

    <!-- RIGHT: both forms. account.js shows one and hides the other. -->
    <main class="form-side">

      <!-- SIGN UP -->
      <section id="signup-section">
        <h1>Create your account</h1>

        <!-- novalidate: our JavaScript checks the form instead of the browser -->
        <form id="signup-form" novalidate>

          <!-- fieldset groups the 3 role choices, legend is its title -->
          <fieldset class="role-group">
            <legend>Choose how you will use FoodBridge.</legend>

            <!-- Each card is a label, so clicking anywhere on it picks the radio button -->
            <label class="role-card selected">
              <input type="radio" name="role" value="donor" checked>
              <span class="role-title">Donor</span>
              <span class="role-text">Post surplus food</span>
            </label>

            <label class="role-card">
              <input type="radio" name="role" value="recipient">
              <span class="role-title">Recipient org</span>
              <span class="role-text">Claim donations</span>
            </label>

            <label class="role-card">
              <input type="radio" name="role" value="volunteer">
              <span class="role-title">Volunteer</span>
              <span class="role-text">Do pickups</span>
            </label>
          </fieldset>

          <!-- "for" matches the input's id -->
          <label for="full-name">Full name</label>
          <input type="text" id="full-name" class="field" placeholder="Kimi Antonelli">

          <label for="org-name">Business / organization name</label>
          <input type="text" id="org-name" class="field" placeholder="MercedesBenz Bakery">

          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" class="field" placeholder="you@example.com">

          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" class="field" placeholder="At least 8 characters and 1 number">

          <!-- error messages appear here -->
          <div id="signup-message" class="form-message"></div>

          <button type="submit" class="btn btn-primary btn-form">Create Account</button>
        </form>

        <p class="switch-link">Already have an account? <a href="#login" id="show-login">Log in</a></p>
      </section>

      <!-- LOG IN (hidden until the user asks for it) -->
      <section id="login-section" hidden>
        <h1>Welcome back</h1>
        <p class="form-subtitle">Log in to continue to FoodBridge.</p>

        <form id="login-form" novalidate>
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="field" placeholder="you@example.com">

          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="field" placeholder="Your password">

          <div id="login-message" class="form-message"></div>

          <button type="submit" class="btn btn-primary btn-form">Log In</button>
        </form>

        <p class="switch-link">Don't have an account? <a href="#signup" id="show-signup">Sign up</a></p>
      </section>

    </main>
  </div>

  <script src="js/account.js"></script>
</body>
</html>
